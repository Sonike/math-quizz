server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip            on;
    gzip_min_length 256;
    gzip_types      text/css application/javascript application/json image/svg+xml;

    # Vite emits content-hashed filenames under /assets — safe to cache forever.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # SPA fallback: serve index.html for any path the filesystem doesn't match,
    # so client-side routes and refreshes don't 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
